<!--
  TvNoiseCaptcha - Widescreen CRT Static Noise CAPTCHA Demo
  Clean user-facing widescreen CRT television interface driven by
  developer variables in tv-captcha-config.js.

  @file index.html
  @author BjornEriksson (https://github.com)
  @version 0.5.1-beta
  @license MIT
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TvNoiseCaptcha — Widescreen CRT Static CAPTCHA</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #111318;
      color: #e5e7eb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    .tv-cabinet {
      background: linear-gradient(180deg, #2b2e36 0%, #1d1f24 100%);
      border: 3px solid #3f4451;
      border-radius: 14px;
      padding: 20px 24px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7);
      max-width: 540px;
      width: 100%;
    }
    .tv-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 12px;
      letter-spacing: 1px;
      color: #9ca3af;
      text-transform: uppercase;
    }
    .tv-led {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #22c55e;
      box-shadow: 0 0 8px #22c55e;
      margin-right: 6px;
    }
    .crt-bezel {
      background-color: #121316;
      border: 4px solid #090a0c;
      border-radius: 10px;
      padding: 6px;
      box-shadow: inset 0 0 24px rgba(0, 0, 0, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    #tv-captcha-canvas {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 4px;
    }
    .verify-row {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }
    .verify-row input {
      flex: 1;
      background-color: #14161a;
      border: 1px solid #4b5563;
      border-radius: 6px;
      padding: 9px 12px;
      color: #ffffff;
      font-family: "Courier New", monospace;
      font-size: 15px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    .verify-row button {
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 9px 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .verify-row button:hover {
      background-color: #1d4ed8;
    }
    .verify-row button.secondary {
      background-color: #374151;
    }
    .status-line {
      margin-top: 10px;
      font-size: 12px;
      min-height: 18px;
      color: #9ca3af;
    }
  </style>
  <script src="tv-captcha-config.js" defer></script>
  <script src="tv-noise-captcha.js" defer></script>
</head>
<body>
  <div class="tv-cabinet">
    <div class="tv-header">
      <span><span class="tv-led"></span>CH-00 // NO SIGNAL</span>
      <span id="timer-readout">RESET IN: 16.0s</span>
    </div>

    <div class="crt-bezel">
      <canvas id="tv-captcha-canvas"></canvas>
    </div>

    <div class="verify-row">
      <input type="text" id="captcha-input" maxlength="8" placeholder="TYPE CODE..." autocomplete="off">
      <button type="button" id="btn-verify">Verify</button>
      <button type="button" id="btn-new" class="secondary" title="New Channel">↻</button>
    </div>
    <div class="status-line" id="status-text">Watch the static carefully — characters fade in and out in random order.</div>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const captcha = new TvNoiseCaptcha('#tv-captcha-canvas', {
        onReset() {
          document.getElementById('captcha-input').value = '';
        },
        onTimeout() {
          const status = document.getElementById('status-text');
          status.textContent = 'Signal lost — powering off and tuning new channel...';
          status.style.color = '#fcd34d';
        }
      });

      setInterval(() => {
        const rem = captcha.getRemainingSeconds();
        document.getElementById('timer-readout').textContent =
          captcha.state === 'running' ? `RESET IN: ${rem.toFixed(1)}s` : 'STANDBY';
      }, 100);

      const handleVerify = () => {
        const val = document.getElementById('captcha-input').value;
        const status = document.getElementById('status-text');
        if (captcha.verify(val)) {
          status.textContent = 'Access granted — human signal confirmed!';
          status.style.color = '#86efac';
        } else {
          status.textContent = 'Incorrect code — keep watching the static.';
          status.style.color = '#f9a8d4';
        }
      };

      document.getElementById('btn-verify').onclick = handleVerify;
      document.getElementById('captcha-input').onkeydown = (e) => {
        if (e.key === 'Enter') handleVerify();
      };

      document.getElementById('btn-new').onclick = () => {
        captcha.reset();
        const status = document.getElementById('status-text');
        status.textContent = 'New channel tuned.';
        status.style.color = '#9ca3af';
      };
    });
  </script>
</body>
</html>
